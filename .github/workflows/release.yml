name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  OPENCODE_CHANNEL: prod

jobs:
  # ── Determine version from package.json ──────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - id: resolve
        run: |
          V=$(node -p "require('./packages/opencode/package.json').version")
          TAG="v${V}-build.${{ github.run_number }}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$V tag=$TAG"

  # ── Console (TUI) binary – cross-compiled for all platforms ──────────
  console:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun

      - name: Build TUI binaries
        run: |
          OPENCODE_VERSION=${{ needs.version.outputs.version }} bun run script/build.ts
        working-directory: packages/opencode

      - name: Package archives
        run: |
          mkdir -p artifacts
          cd packages/opencode/dist
          for dir in */; do
            name="${dir%/}"
            if echo "$name" | grep -qE "^(opencode-linux|opencode-darwin)"; then
              tar czf "$OLDPWD/artifacts/${name}.tar.gz" -C "$dir/bin" .
            else
              (cd "$dir/bin" && zip -r "$OLDPWD/artifacts/${name}.zip" .)
            fi
          done

      - name: Upload
        uses: actions/upload-artifact@5f2fc44ce3a6c0cdf8762f2b8a60eb614a53352f # v4.3.4
        with:
          name: console
          path: artifacts/

  # ── Web app (packages/app) – static build ────────────────────────────
  webapp:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun

      - name: Build web app
        run: bun run build
        working-directory: packages/app

      - name: Package
        run: |
          cd packages/app
          tar czf ../../webapp.tar.gz dist/

      - name: Upload
        uses: actions/upload-artifact@5f2fc44ce3a6c0cdf8762f2b8a60eb614a53352f # v4.3.4
        with:
          name: webapp
          path: webapp.tar.gz

  # ── Desktop app (Electron) – platform-specific installers ───────────
  desktop:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            package-flags: --linux
          - os: macos-latest
            target: mac
            package-flags: --mac
          - os: windows-latest
            target: win
            package-flags: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun

      - name: Build & package desktop
        run: |
          OPENCODE_VERSION=${{ needs.version.outputs.version }} bun run prebuild
          OPENCODE_VERSION=${{ needs.version.outputs.version }} bun run build
          OPENCODE_VERSION=${{ needs.version.outputs.version }} \
            bunx electron-builder ${{ matrix.package-flags }} \
              --config electron-builder.config.ts
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        # macOS codesigning / Windows authenticode will fail without
        # the proper certificates in this fork.  Build artifacts are
        # still produced; signing can be wired up later.
        continue-on-error: true

      - name: Upload
        uses: actions/upload-artifact@5f2fc44ce3a6c0cdf8762f2b8a60eb614a53352f # v4.3.4
        with:
          name: desktop-${{ matrix.target }}
          path: packages/desktop/dist/

  # ── Aggregate everything into a GitHub Release ──────────────────────
  release:
    needs: [version, console, webapp, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download all artifacts
        uses: actions/download-artifact@e8cbf030de2d63669c13c1aa249b35b39db27ad7 # v4.2.1

      - name: Create GitHub Release
        uses: ncipollo/release-action@a2d71a7b07ef1c0a4e77abb2040a8b60bfec6b2b # v1.16.0
        with:
          tag: ${{ needs.version.outputs.tag }}
          name: "Build ${{ github.run_number }} — v${{ needs.version.outputs.version }}"
          body: |
            ## Automated Release

            - **Version:** ${{ needs.version.outputs.version }}
            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}

            ### Downloads

            | Artifact | Platform |
            |----------|----------|
            | Console (TUI) binaries | Linux / macOS / Windows (multiple architectures) |
            | Desktop installers | Linux (.AppImage, .deb, .rpm), macOS (.dmg, .zip), Windows (.exe) |
            | Web app | Static site archive |
          draft: true
          prerelease: false
          artifacts: |
            console/*.tar.gz
            console/*.zip
            webapp/*.tar.gz
            desktop-linux/*
            desktop-mac/*
            desktop-win/*
          artifactErrorsFailBuild: false
          updateExistingRelease: false
          token: ${{ github.token }}
